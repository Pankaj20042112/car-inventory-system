openapi: 3.0.0
info:
  title: Car Dealership Inventory API
  description: Production-grade REST API backend for high-end vehicle management and sales validation.
  version: 1.0.0
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Register a new user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        201:
          description: User registered successfully.
  /auth/login:
    post:
      summary: Login user and return JWT session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login authorized.

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: car-dealership-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: car_dealership
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_dealership"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: car-dealership-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:password123@db:5432/car_dealership?schema=public"
      JWT_SECRET: "secret_car_dealership_key_123"
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: car-dealership-web
    ports:
      - "5173:80"
    depends_on:
      - api
      - db

volumes:
  pgdata:
